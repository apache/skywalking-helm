{{- if and .Values.ui.enabled .Values.ui.config }}
{{- /*
horizon.yaml is built by deep-merging chart-computed values with `ui.config`.

The chart-computed values are emitted as `${VAR:default}` TOKENS, not literals,
and that is load-bearing. Horizon expands `${...}` over the raw file TEXT before
parsing it (apps/bff/src/config/loader.ts), so a literal-valued file silently
makes the matching HORIZON_* env var inert -- and for a field the file omits,
env only applies to the handful whose schema default reads process.env. Writing
tokens keeps the in-cluster value as the default AND leaves every field
overridable by env, which is how the image is meant to be configured.

Only values the image cannot know belong here. Anything equal to Horizon's own
default is left out so upstream owns it.
*/ -}}
{{- $oap := include "skywalking.oap.fullname" . }}
{{- $oapDefaults := dict
  "queryUrl" (printf "${HORIZON_OAP_QUERY_URL:http://%s:%v}" $oap .Values.oap.ports.rest)
}}
{{- /* The admin host arrived in OAP 11. On a 10.x release 17128 is the
AI-pipeline URI-recognition server, so advertising an adminUrl there would point
Horizon at the wrong service -- only emit it when the port is actually exposed. */ -}}
{{- if .Values.oap.ports.admin }}
{{- $_ := set $oapDefaults "adminUrl" (printf "${HORIZON_OAP_ADMIN_URL:http://%s:%v}" $oap .Values.oap.ports.admin) }}
{{- end }}
{{- /* zipkinUrl only when the Zipkin query port is exposed -- the schema
requires a valid URL, so an empty value fails at boot. */ -}}
{{- $zipkinQueryPort := index .Values.oap.ports "zipkin-query" }}
{{- if $zipkinQueryPort }}
{{- $_ := set $oapDefaults "zipkinUrl" (printf "${HORIZON_OAP_ZIPKIN_URL:http://%s:%v/zipkin}" $oap $zipkinQueryPort) }}
{{- end }}
{{- /* server.port is chart-derived rather than a token: the container port and
the probes both come from ui.service.internalPort, so the BFF has to bind the
same one. server.host is omitted -- the image's own ENV already sets it. */ -}}
{{- $serverDefaults := dict "port" (.Values.ui.service.internalPort | int) }}
{{- /* Horizon derives its public base URL per-request when publicUrl is blank,
which is wrong behind an ingress that rewrites Host: SSO callbacks and the OAuth
issuer would be built from the internal address. */ -}}
{{- if and .Values.ui.ingress.enabled .Values.ui.ingress.hosts }}
{{- $entry := first .Values.ui.ingress.hosts }}
{{- /* an entry may carry a path -- ui-ingress.yaml splits it on "/" -- while
tls[].hosts holds bare hostnames, so compare only the hostname. */ -}}
{{- $host := first (splitList "/" $entry) }}
{{- /* https only when THIS host is covered by a tls block -- a tls entry for a
different host does not make this one https, and an https publicUrl on a plain
host breaks the SSO callback. */ -}}
{{- $scheme := "http" }}
{{- range .Values.ui.ingress.tls }}
{{- /* an entry with no `hosts` is valid: Kubernetes reads it as the controller's
default/wildcard certificate, so it covers this host too. */ -}}
{{- if or (empty (.hosts | default list)) (has $host (.hosts | default list)) }}{{ $scheme = "https" }}{{ end }}
{{- end }}
{{- $_ := set $serverDefaults "publicUrl" (printf "${HORIZON_PUBLIC_URL:%s://%s}" $scheme $entry) }}
{{- end }}
{{- /* Mounting this file replaces the image's, so any token it does not carry
is lost and the matching HORIZON_* variable goes inert. Users are the one field
where that is silently fatal -- the pod still reports Ready -- so the token is
preserved here unless the operator writes users of their own. */ -}}
{{- $authDefaults := dict "local" (dict "users" "${HORIZON_AUTH_LOCAL_USERS:[]}") }}
{{- $defaults := dict "oap" $oapDefaults "server" $serverDefaults "auth" $authDefaults }}
{{- $userConfig := default (dict) .Values.ui.config }}
{{- $merged := mergeOverwrite (deepCopy $defaults) (deepCopy $userConfig) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "skywalking.ui.fullname" . }}
  labels:
    app: {{ template "skywalking.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    component: "{{ .Values.ui.name }}"
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
data:
  horizon.yaml: |
{{ toYaml $merged | indent 4 }}
{{- end }}

{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "skywalking.ui.fullname" . }}
  labels:
    app: {{ template "skywalking.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    component: "{{ .Values.ui.name }}"
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.ui.replicas }}
  # Horizon UI's BFF holds the session table in memory. Recreate (not
  # RollingUpdate) avoids the brief window of two pods serving traffic with
  # disjoint session state.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ template "skywalking.name" . }}
      component: "{{ .Values.ui.name }}"
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "skywalking.name" . }}
        component: "{{ .Values.ui.name }}"
        release: {{ .Release.Name }}
      annotations:
{{- if .Values.ui.config }}
        # A subPath mount never updates in place, so roll the pod when the
        # rendered horizon.yaml changes.
        checksum/config: {{ include (print $.Template.BasePath "/ui-configmap.yaml") . | sha256sum }}
{{- end }}
        {{- with .Values.ui.podAnnotations }}
{{ toYaml . | indent 8 }}
        {{- end }}
    spec:
      {{- with .Values.ui.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      affinity:
      {{- with .Values.ui.nodeAffinity }}
        nodeAffinity:
{{ toYaml . | indent 10 }}
      {{- end }}
{{- if .Values.ui.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.ui.nodeSelector | indent 8 }}
{{- end }}
{{- if .Values.ui.tolerations }}
      tolerations:
{{ toYaml .Values.ui.tolerations | indent 8 }}
{{- end }}
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
{{- end }}
      containers:
      - name: {{ .Values.ui.name }}
        image: {{ .Values.ui.image.repository }}:{{ required "ui.image.tag is required" .Values.ui.image.tag }}
        imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.ui.service.internalPort }}
          name: page
{{- if .Values.ui.resources }}
        resources:
{{ toYaml .Values.ui.resources | indent 10 }}
{{- end }}
{{- if .Values.ui.livenessProbe }}
        livenessProbe:
{{ toYaml .Values.ui.livenessProbe | indent 10 }}
{{- end }}
{{- if .Values.ui.readinessProbe }}
        readinessProbe:
{{ toYaml .Values.ui.readinessProbe | indent 10 }}
{{- end }}
{{- $oap := include "skywalking.oap.fullname" . }}
        env:
        # Horizon's image ships a fully env-tokenized /app/horizon.yaml, so the
        # chart supplies only what it can compute and leaves every other field to
        # the image's own defaults -- which keeps all of them settable through
        # ui.extraEnv / ui.envFromSecret. Mounting a file here instead would
        # replace that file and silently make those variables inert.
        - name: HORIZON_SERVER_PORT
          value: {{ .Values.ui.service.internalPort | quote }}
        - name: HORIZON_OAP_QUERY_URL
          value: "http://{{ $oap }}:{{ .Values.oap.ports.rest }}"
{{- if .Values.oap.ports.admin }}
        - name: HORIZON_OAP_ADMIN_URL
          value: "http://{{ $oap }}:{{ .Values.oap.ports.admin }}"
{{- end }}
{{- $zipkin := index .Values.oap.ports "zipkin-query" }}
{{- if $zipkin }}
        - name: HORIZON_OAP_ZIPKIN_URL
          value: "http://{{ $oap }}:{{ $zipkin }}/zipkin"
{{- end }}
{{- if and .Values.ui.ingress.enabled .Values.ui.ingress.hosts }}
{{- $entry := first .Values.ui.ingress.hosts }}
{{- $host := first (splitList "/" $entry) }}
{{- $scheme := "http" }}
{{- range .Values.ui.ingress.tls }}
{{- if or (empty (.hosts | default list)) (has $host (.hosts | default list)) }}{{ $scheme = "https" }}{{ end }}
{{- end }}
        # SSO callbacks and the OAuth issuer are built from this; derived per
        # host, since a tls block may cover only some of them.
        - name: HORIZON_PUBLIC_URL
          value: "{{ $scheme }}://{{ $entry }}"
{{- end }}
{{- range .Values.ui.extraEnv }}
        - {{ toYaml . | nindent 10 | trim }}
{{- end }}
{{- if .Values.ui.envFromSecret }}
        envFrom:
        - secretRef:
            name: {{ .Values.ui.envFromSecret | quote }}
{{- end }}
        volumeMounts:
{{- if .Values.ui.config }}
        - name: horizon-config
          mountPath: /app/horizon.yaml
          subPath: horizon.yaml
          readOnly: true
{{- end }}
        - name: horizon-data
          mountPath: /data
{{- with .Values.ui.extraVolumeMounts }}
{{ toYaml . | indent 8 }}
{{- end }}
      volumes:
{{- if .Values.ui.config }}
      - name: horizon-config
        configMap:
          name: {{ template "skywalking.ui.fullname" . }}
          items:
          - key: horizon.yaml
            path: horizon.yaml
{{- end }}
      - name: horizon-data
{{- if .Values.ui.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ default (printf "%s-data" (include "skywalking.ui.fullname" .)) .Values.ui.persistence.existingClaim }}
{{- else }}
        emptyDir: {}
{{- end }}
{{- with .Values.ui.extraVolumes }}
{{ toYaml . | indent 6 }}
{{- end }}
{{- end }}

# https://docs.sentry.io/server/installation/docker/#running-migrations

apiVersion: batch/v1
kind: Job
metadata:
  # NOTE: This Job is intentionally a normal release resource, NOT a Helm hook.
  # Running it as a post-install/post-upgrade hook deadlocks `helm upgrade --install --wait`:
  # Helm waits for every release resource to become Ready before it runs post-* hooks, but the
  # OAP Deployment runs in `-Dmode=no-init` and never becomes Ready until this Job has created
  # the storage schema -- so the hook (and therefore the schema) would never run. As a main-phase
  # resource the Job runs alongside the OAP Deployment, which blocks in no-init mode until the
  # schema appears, so `--wait` resolves instead of deadlocking.
  #
  # The name carries a hash of the chart values: a Job's `spec.template` is immutable, so a stable
  # name would make `helm upgrade` fail with "field is immutable" whenever the pod template changes.
  # Hashing yields a fresh Job whenever a relevant value changes; Helm prunes the previous one.
  #
  # The pod template's labels follow the release's label style (see "skywalking.labelStyle"), so the
  # style is part of the hash too: moving a release from legacy to modern renames the Job instead of
  # patching its immutable template. A legacy release hashes exactly what 5.0.0 hashed, so upgrading
  # one keeps its Job. The `labelStyle` value itself is left out: it only overrides how the style is
  # found, and setting or removing it must not run init again.
  {{- $hashed := omit .Values "labelStyle" }}
  {{- if eq (include "skywalking.labelStyle" .) "modern" }}
  {{- $_ := set $hashed "_labelStyle" "modern" }}
  {{- end }}
  name: "{{ printf "%s-init-%s" (include "skywalking.oap.fullname" . | trunc 40 | trimSuffix "-") ($hashed | toYaml | sha256sum | trunc 8) }}"
  labels:
    {{- include "skywalking.labels" (dict "context" . "component" (printf "%s-init" .Values.oap.name | trunc 63 | trimSuffix "-") "legacyComponent" (printf "%s-job" (include "skywalking.fullname" .))) | nindent 4 }}
spec:
  {{- if .Values.oapInit.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.oapInit.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      name: "{{ .Release.Name }}-oap-init"
      # Do not change these labels in either style. A Job's pod template is immutable, and an upgrade
      # with unchanged values keeps this Job's name, so Helm patches the existing Job and any edit here
      # fails the upgrade with "field is immutable". The legacy branch renders exactly what 5.0.0 did for
      # every release 5.0.0 could install; the 63-character cap only matters for names it rejected.
      # test/e2e/e2e-upgrade.yaml checks this.
      labels:
      {{- if eq (include "skywalking.labelStyle" .) "legacy" }}
        app: {{ template "skywalking.name" . }}
        component: {{ printf "%s-job" (include "skywalking.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
        release: {{ .Release.Name }}
      {{- else }}
        {{- include "skywalking.selectorLabels.modern" (dict "context" . "component" (printf "%s-init" .Values.oap.name | trunc 63 | trimSuffix "-")) | nindent 8 }}
      {{- end }}
{{- if .Values.oapInit.extraPodLabels }}
{{ toYaml .Values.oapInit.extraPodLabels | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ template "skywalking.serviceAccountName.oap" . }}
      {{- with .Values.oap.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.oapInit.nodeAffinity }}
      affinity:
      {{- end }}
      {{- with .Values.oapInit.nodeAffinity }}
        nodeAffinity:
{{ toYaml . | indent 10 }}
      {{- end }}
{{- if .Values.oapInit.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.oapInit.nodeSelector | indent 8 }}
{{- end }}
{{- if .Values.oapInit.tolerations }}
      tolerations:
{{ toYaml .Values.oapInit.tolerations | indent 8 }}
{{- end }}
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
{{- end }}
      restartPolicy: Never
      initContainers:
        {{- include "skywalking.containers.wait-for-storage" . | nindent 6 }}
      containers:
      - name: {{ .Values.oap.name }}
        image: {{ .Values.oap.image.repository }}:{{ required "oap.image.tag is required" .Values.oap.image.tag }}
        imagePullPolicy: {{ .Values.oap.image.pullPolicy }}
{{- if .Values.oap.resources }}
        resources:
{{ toYaml .Values.oap.resources | indent 10 }}
{{- end }}
        env:
        - name: JAVA_OPTS
          value: "{{ .Values.oap.javaOpts }} -Dmode=init"
        {{- include "skywalking.oap.envs.storage" . | nindent 8 }}
        {{- range $key, $value :=  .Values.oap.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- range .Values.oap.extraEnv }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
{{- if .Values.oap.envFromSecret }}
        envFrom:
        - secretRef:
            name: {{ .Values.oap.envFromSecret | quote }}
{{- end }}

        volumeMounts:
        {{- include "skywalking.oap.volumeMounts" . | nindent 8 }}

      volumes:
      {{- include "skywalking.oap.volumes" . | nindent 6 }}

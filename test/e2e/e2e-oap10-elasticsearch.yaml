# This file is used to show how to write configuration files and can be used to test.

setup:
  env: kind
  file: kind28.yaml
  init-system-environment: env
  kind:
    expose-ports:
      - namespace: istio-system
        resource: service/skywalking-ui
        port: 80
  steps:
    - name: install yq
      command: bash test/e2e/setup-e2e-shell/install.sh yq
    - name: install kubectl
      command: bash test/e2e/setup-e2e-shell/install.sh kubectl
    - name: install istio
      command: |
        bash test/e2e/setup-e2e-shell/install.sh istioctl
        istioctl install -y --set profile=demo \
          --set meshConfig.defaultConfig.envoyAccessLogService.address=skywalking-satellite.istio-system:11800 \
          --set meshConfig.enableEnvoyAccessLogService=true
        kubectl label namespace default istio-injection=enabled
    - name: Install helm
      command: bash test/e2e/setup-e2e-shell/install.sh helm
    - name: Install ECK operator
      command: |
        helm dep up chart/skywalking
        tar xzf chart/skywalking/charts/eck-operator-3.3.1.tgz -C /tmp eck-operator/charts/eck-operator-crds
        helm -n istio-system install eck-crds /tmp/eck-operator/charts/eck-operator-crds \
                       --create-namespace
    - name: Install SkyWalking
      command: |
        helm -n istio-system install skywalking chart/skywalking \
                       --set fullnameOverride=skywalking \
                       --set eck-operator.installCRDs=false \
                       --set oap.env.SW_ENVOY_METRIC_ALS_HTTP_ANALYSIS=k8s-mesh \
                       --set oap.env.SW_ENVOY_METRIC_ALS_TCP_ANALYSIS=k8s-mesh \
                       --set oap.env.K8S_SERVICE_NAME_RULE='e2e::${service.metadata.name}' \
                       --set oap.replicas=1 \
                       --set ui.image.repository=$UI_REPO \
                       --set ui.image.tag=$UI_TAG \
                       --set oap.image.repository=$OAP_10_REPO \
                       --set oap.image.tag=$OAP_10_TAG \
                       --set oap.storageType=elasticsearch \
                       --set oap.ports.admin=null \
                       --set ui.config.templates.mode=readonly \
                       --set satellite.enabled=true \
                       --set satellite.image.repository=$SATELLITE_REPO \
                       --set satellite.image.tag=$SATELLITE_TAG \
                       -f test/e2e/values.yaml
      wait:
        - namespace: istio-system
          resource: deployments/skywalking-oap
          for: condition=available
        - namespace: istio-system
          resource: deployments/skywalking-satellite
          for: condition=available
        - namespace: istio-system
          resource: deployments/skywalking-ui
          for: condition=available
    - name: Deploy demo services
      command: |
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/platform/kube/bookinfo.yaml
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/networking/bookinfo-gateway.yaml
        # Enable TCP services
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/platform/kube/bookinfo-ratings-v2.yaml
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/platform/kube/bookinfo-db.yaml
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/networking/destination-rule-all.yaml
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/networking/virtual-service-ratings-db.yaml
      wait:
        - namespace: default
          resource: pod
          for: condition=Ready
    - name: Generate traffic
      path: traffic-gen.yaml
      wait:
        - namespace: default
          resource: pod
          for: condition=Ready
  timeout: 25m

verify:
  retry:
    count: 30
    interval: 10s
  cases:
    # Every assertion below goes through Horizon's BFF: horizon -> oap -> storage.
    # Nothing talks to OAP's GraphQL directly -- that would test OAP, not the chart.

    # The operator can log in, and lands with the role the values file granted.
    - query: |
        bash test/e2e/script/horizon.sh http://${service_skywalking_ui_host}:${service_skywalking_ui_80} get /api/auth/me | yq -p json -o yaml '{"username": .username, "roles": .roles}'
      expected: expected/horizon-me.yml

    # Cluster Status -> Query pane. Proves oap.queryUrl reaches the in-cluster OAP.
    - query: |
        bash test/e2e/script/horizon.sh http://${service_skywalking_ui_host}:${service_skywalking_ui_80} get /api/oap/info | yq -p json -o yaml '{"reachable": .reachable, "version": .version}'
      expected: expected/horizon-oap-info.yml

    # Inverted: the admin host arrived in OAP 11, so 10.4 has none and Horizon must
    # be running readonly. These endpoints answer HTTP 200 either way and report the
    # failure in the body, so the assertion flips rather than disappearing.
    - query: |
        bash test/e2e/script/horizon.sh http://${service_skywalking_ui_host}:${service_skywalking_ui_80} get '/api/preflight?refresh=1' | yq -p json -o yaml '{"adminReachable": .adminReachable, "templatesMode": .templatesMode}'
      expected: expected/horizon-admin-readonly.yml

    # readonly still serves templates -- from the bundle in the image, without ever
    # contacting OAP.
    - query: |
        bash test/e2e/script/horizon.sh http://${service_skywalking_ui_host}:${service_skywalking_ui_80} get '/api/admin/templates/sync-status?force=true' | yq -p json -o yaml '{"mode": .mode, "unreachable": .unreachable}'
      expected: expected/horizon-templates-readonly.yml

    # The mesh services the demo app produces, listed through Horizon.
    # NOTE: the layer is MESH, not GENERAL -- the fixture feeds OAP via Envoy ALS
    # with k8s-mesh analysis, so nothing lands in GENERAL. Asserting .reachable here
    # would be worthless: the handler returns reachable:true with an empty list even
    # when OAP is down.
    - query: |
        bash test/e2e/script/horizon.sh http://${service_skywalking_ui_host}:${service_skywalking_ui_80} get /api/layer/MESH/services | yq -p json -o yaml '{"layer": .layer, "services": ([.services[].name] | sort)}'
      expected: expected/horizon-mesh-services.yml

    # service_cpm for one of them -- the full read path through to storage.
    - query: |
        bash test/e2e/script/horizon.sh http://${service_skywalking_ui_host}:${service_skywalking_ui_80} post /api/layer/MESH/dashboard '{"service":"e2e::productpage","scope":"service","widgets":[{"id":"cpm","title":"Service CPM","type":"card","expressions":["service_cpm"]}]}' | yq -p json -o yaml '{"reachable": .reachable, "id": .widgets[0].id, "positive": (.widgets[0].value != null and .widgets[0].value > 0)}'
      expected: expected/horizon-service-cpm.yml

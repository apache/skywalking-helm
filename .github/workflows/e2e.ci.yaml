name: Test

on:
  pull_request:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - master

env:
  SKIP_TEST: true
  ISTIO_VERSION: 1.24.0

jobs:
  als:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test:
          - name: Horizon + OAP 11 + Elasticsearch
            config: test/e2e/e2e-oap11-elasticsearch.yaml
            slug: oap11-elasticsearch
          - name: Horizon + OAP 11 + BanyanDB (standalone)
            config: test/e2e/e2e-oap11-banyandb-standalone.yaml
            slug: oap11-banyandb-standalone
          - name: Horizon + OAP 11 + BanyanDB (cluster)
            config: test/e2e/e2e-oap11-banyandb-cluster.yaml
            slug: oap11-banyandb-cluster
          - name: Config override via ConfigMap (OAP + Horizon)
            config: test/e2e/e2e-config-override.yaml
            slug: config-override
    name: ${{ matrix.test.name }}
    steps:
      - uses: actions/checkout@v2
      - name: Login to ghcr
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
      - name: ${{ matrix.test.name }}
        uses: apache/skywalking-infra-e2e@8c21e43e241a32a54bdf8eeceb9099eb27e5e9b4
        with:
          e2e-file: $GITHUB_WORKSPACE/${{ matrix.test.config }}
      - if: ${{ failure() }}
        run: |
          df -h
          du -sh .
          for dir in $(find . -type d -not -name '.*'); do
            du -sh $dir
          done
          docker images
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        name: Upload Logs
        with:
          name: logs-${{ matrix.test.slug }}
          path: "${{ env.SW_INFRA_E2E_LOG_DIR }}"


  build:
    runs-on: ubuntu-latest
    needs: [als]
    steps:
      - name: dummy
        run: echo
